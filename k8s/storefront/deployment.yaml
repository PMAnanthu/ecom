apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: ecom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storefront
  template:
    metadata:
      labels:
        app: storefront
    spec:
      containers:
        - name: storefront
          image: ghcr.io/YOUR_ORG/ecom-storefront:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.ecom.app/api"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
  namespace: ecom
spec:
  selector:
    app: storefront
  ports:
    - port: 3000
      targetPort: 3000
