apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-ui
  namespace: ecom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platform-ui
  template:
    metadata:
      labels:
        app: platform-ui
    spec:
      containers:
        - name: platform-ui
          image: ghcr.io/YOUR_ORG/ecom-platform-ui:latest
          ports:
            - containerPort: 3001
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.ecom.app/api"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: platform-ui
  namespace: ecom
spec:
  selector:
    app: platform-ui
  ports:
    - port: 3001
      targetPort: 3001
