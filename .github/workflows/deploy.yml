name: Build & Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  ORG: ${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - auth-service
          - platform-service
          - store-service
          - catalog-service
          - order-service
          - storefront-service
          - api-gateway
          - platform-ui
          - storefront
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: >-
            ${{ contains(fromJson('["platform-ui","storefront"]'), matrix.service)
              && matrix.service
              || format('services/{0}', matrix.service) }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.REGISTRY }}/${{ env.ORG }}/ecom-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config

      - name: Roll out deployments
        run: |
          for svc in auth-service platform-service store-service catalog-service order-service storefront-service api-gateway platform-ui storefront; do
            kubectl rollout restart deployment/${svc} -n ecom
          done
          kubectl rollout status deployment/api-gateway -n ecom --timeout=120s
